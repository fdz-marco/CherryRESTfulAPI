# ============================================================
#  Cherry RESTful API — Nginx site config (subfolder placement)
#  Use when the API lives under a sub-path, e.g. /api/.
#
#  Instructions:
#    1. Adjust the location block path below (/api/)
#    2. Set the same path in PHP: CherryRESTfulAPI::setBasePath('/api')
#    3. Place in /etc/nginx/sites-available/ and enable as usual
# ============================================================

# -------- HTTP → HTTPS redirect -----------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    return 301  https://yourdomain.com$request_uri;
}

# -------- HTTPS server block --------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    root  /var/www/yourdomain/public;
    index index.php;

    # -- SSL ------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    # -- Security headers -----------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "no-referrer"                                  always;
    add_header Cache-Control             "no-store"                                     always;

    # -- Static files at root (optional) --------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # -- API sub-path: route everything to index.php --------
    location /api/ {                                      # <-- change to match your sub-path
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # -- PHP-FPM --------------------------------------------
    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.1-fpm.sock;    # adjust PHP version as needed
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_param  HTTP_X_REAL_IP        $remote_addr;
        fastcgi_param  HTTP_X_FORWARDED_FOR  $proxy_add_x_forwarded_for;

        fastcgi_read_timeout 60s;
    }

    # -- Block access to sensitive files --------------------
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
    location ~ /(composer\.(json|lock)|package\.json|package-lock\.json)$ {
        deny all;
        return 404;
    }

    autoindex off;

    # -- Logging --------------------------------------------
    access_log /var/log/nginx/yourdomain-access.log;
    error_log  /var/log/nginx/yourdomain-error.log;
}
