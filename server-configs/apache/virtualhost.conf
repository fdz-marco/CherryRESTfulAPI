# ============================================================
#  Cherry RESTful API — Apache Virtual Host (production)
#  Place in: /etc/apache2/sites-available/yourdomain.conf
#  Enable:   sudo a2ensite yourdomain.conf && sudo systemctl reload apache2
#
#  Prerequisites:
#    sudo a2enmod rewrite headers ssl
# ============================================================

# -------- HTTP → HTTPS redirect -----------------------------
<VirtualHost *:80>
    ServerName  yourdomain.com
    ServerAlias www.yourdomain.com
    Redirect permanent / https://yourdomain.com/
</VirtualHost>

# -------- HTTPS server block --------------------------------
<VirtualHost *:443>
    ServerName  yourdomain.com
    ServerAlias www.yourdomain.com

    DocumentRoot /var/www/yourdomain/public
    DirectoryIndex index.php

    # -- SSL ------------------------------------------------
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem

    # Modern TLS only
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # -- Directory config -----------------------------------
    <Directory /var/www/yourdomain/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # -- PHP-FPM via Unix socket ----------------------------
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # -- Block access to sensitive files --------------------
    <FilesMatch "^(\.env|\.git|composer\.(json|lock))">
        Require all denied
    </FilesMatch>

    # -- Security headers -----------------------------------
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        Header always set X-Content-Type-Options    "nosniff"
        Header always set X-Frame-Options           "DENY"
        Header always set Referrer-Policy           "no-referrer"
        Header always set Cache-Control             "no-store"
    </IfModule>

    # -- Logging --------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/yourdomain-error.log
    CustomLog ${APACHE_LOG_DIR}/yourdomain-access.log combined
</VirtualHost>
